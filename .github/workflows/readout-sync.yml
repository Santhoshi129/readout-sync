name: Readout Sync

on:
  schedule:
    # Every 10 minutes (GitHub may delay a few minutes under load).
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

concurrency:
  group: readout-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install mongodb@6 --no-save
      - run: node scripts/sync-readout.mjs
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          GHL_LG_TOKEN: ${{ secrets.GHL_LG_TOKEN }}
          GHL_AA_TOKEN: ${{ secrets.GHL_AA_TOKEN }}
          GOOGLE_SA_EMAIL: ${{ secrets.GOOGLE_EMAIL }}
          GOOGLE_SA_KEY: ${{ secrets.GOOGLE_KEY }}
